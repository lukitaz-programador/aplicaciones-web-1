<style>
        .glow-hover:hover {
            box-shadow: 0 0 15px rgba(212, 255, 0, 0.4);
        }
        .form-input {
            background-color: #2A2A2B;
            border-color: transparent;
        }

            border-color: #D4FF00;
            outline: none;
            box-shadow: none;
        }
        /* Hide nav shell on login screen */
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-primary font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Ambient background layer -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-30 mix-blend-overlay" data-alt="A dark, moody fitness gym background, featuring heavy iron weights and power racks silhouetted against dramatic, low-key lighting. The scene is lit with deep shadows and subtle, energetic lime green rim lighting, creating a high-performance, intense atmosphere. The composition is highly contrasted, dark mode aesthetic, premium and intense." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDW9JvQVPT5rE5K6jOdGPAL3ekzHAvkrKGJhWpMsIzxGdZBbidYv6moNTJJJXZMVfGRsWxFXQloQdaD3v-FowIYDJYgdMARE8F4deoqG7c-WAIeHSQvYqoECVvHhPmtE22MTdAG7kxbgoyZadXPXMUvD-RNgZI_iRmxRDR8OCbT8UNpc3djgZZItPilzRct2vTUorM4zc5zyacXK8sH10oQcixLicsN1RWV2B-ATxCvUyodC6MsxCg')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile py-lg">
<!-- Brand Header -->
<div class="text-center mb-lg">
<div class="flex justify-center items-center gap-sm mb-4">
<span class="material-symbols-outlined text-4xl text-energetic-lime" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<h1 class="font-headline-xl text-headline-xl tracking-tighter text-primary">SisyfoGym</h1>
</div>
<p class="font-body-md text-body-md text-secondary">Push beyond your limits.</p>
</div>
<!-- Authentication Card -->
<div class="bg-surface-container-high rounded-xl p-md shadow-2xl border border-white/5 backdrop-blur-sm">
<!-- Toggle Login / Register (Visual Only for now) -->
<div class="flex mb-lg border-b border-outline-variant/30">
<button class="flex-1 pb-sm font-label-bold text-label-bold text-energetic-lime border-b-2 border-energetic-lime transition-colors">Log In</button>
<button class="flex-1 pb-sm font-label-bold text-label-bold text-secondary hover:text-primary transition-colors">Sign Up</button>
</div>
<!-- Profile Picture Upload (Only visible on Sign Up usually, but included as requested) -->
<div class="flex flex-col items-center mb-md hidden" id="profile-upload-section">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-highest border-2 border-dashed border-outline-variant flex items-center justify-center overflow-hidden mb-sm transition-all group-hover:border-energetic-lime">
<span class="material-symbols-outlined text-3xl text-secondary group-hover:text-energetic-lime transition-colors">add_a_photo</span>
<!-- Hidden image placeholder for when uploaded -->
<img class="hidden object-cover w-full h-full" data-alt="A high-contrast, professional profile portrait of an athlete in a dark studio setting. The lighting is dramatic, emphasizing physical fitness and determination, aligning with a premium gym aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAp5-xVD2gxtz7gKNqQW4JTbJj_bhxlekY8BMn-x4rGXIBasl3nVwc8vV8-ZDhrmNsC5i9QESWanjS6bumv9zRkov-wAG3Pb5wQyzE8lRtdTZyImCz08Agh6GX8KyGbOtbT3lX0UrxYA6MUbhIWXQQHQx2WRbUbIP6tZHp4ilN9N3ZiM4WZ2nKAygliYN2prtGFC7UBQ6BibKJ30UnSvk1kyv9eDfct7njmm40Yg0FkndDEeo5g0g8"/>
</div>
<span class="font-label-sm text-label-sm text-secondary text-center block w-full group-hover:text-primary transition-colors">Upload Photo</span>
</div>
</div>
<form class="flex flex-col gap-sm">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-secondary" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="form-input w-full rounded-lg py-sm pl-10 pr-3 text-primary font-body-md" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs mb-sm">
<label class="font-label-sm text-label-sm text-secondary" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="form-input w-full rounded-lg py-sm pl-10 pr-3 text-primary font-body-md" id="password" placeholder="Enter your password" type="password"/>
</div>
<div class="text-right mt-1">
<a class="font-label-sm text-label-sm text-energetic-lime hover:underline" href="#">Forgot password?</a>
</div>
</div>
<button class="bg-energetic-lime text-deep-charcoal font-label-bold text-label-bold py-sm rounded-lg w-full flex justify-center items-center gap-xs glow-hover transition-all mt-xs" type="submit">
                    Enter the Forge
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<div class="flex items-center gap-sm my-md">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Or</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Google Login Button -->
<button class="bg-transparent border-2 border-white/20 text-primary font-label-bold text-label-bold py-sm rounded-lg w-full flex justify-center items-center gap-sm hover:bg-white/5 transition-colors">
<!-- Using a generic icon as placeholder for Google logo to stick to Material Symbols -->
<span class="material-symbols-outlined text-xl">account_circle</span>
                Ingresar con Google
            </button>
</div>
</main>
</body></html>
